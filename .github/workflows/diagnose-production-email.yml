name: Diagnose production invoice email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Read redacted invoice email failure
    runs-on: [self-hosted, Linux, X64, account-island]
    timeout-minutes: 5
    steps:
      - name: Show latest redacted Xero sync activity
        shell: bash
        run: |
          set -euo pipefail
          output="$({ docker logs --since 2h account-island-app 2>&1 || true; } \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted-email]/g' \
            | sed -E 's/(access_token|refresh_token|client_secret)([^[:space:]]*)/[redacted-secret]/Ig' \
            | grep -F -A 16 'Recovered Xero read-only sync finalisation' \
            | tail -n 40)"
          if [ -z "$output" ]; then
            echo "No recent Xero sync activity was found." >&2
            exit 1
          fi
          printf '%s\n' "$output"
