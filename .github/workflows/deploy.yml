name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-island-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: [self-hosted, Linux, X64, account-island]
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.accountisland.com
    env:
      DEPLOY_DIR: /mnt/data/account-island
      DOTNET_ROOT: /mnt/data/account-island/dotnet
      DOTNET_CLI_HOME: /mnt/data/account-island/dotnet-cli
      NUGET_PACKAGES: /mnt/data/account-island/nuget/packages

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reclaim deployment disk space
        shell: bash
        run: |
          set -euo pipefail
          docker builder prune --all --force
          docker image prune --all --force --filter "until=1h"
          find "$DEPLOY_DIR/backups" -type f \
            \( -name 'account-island-*.tar.gz' -o -name 'account-island-*.tar.gz.sha256' \) \
            -mtime +30 -delete 2>/dev/null || true
          df -h "$DEPLOY_DIR"

      - name: Run test suite
        shell: bash
        run: /mnt/data/account-island/dotnet/dotnet test FijiAccounts.slnx --configuration Release

      - name: Publish production application
        shell: bash
        run: |
          /mnt/data/account-island/dotnet/dotnet publish src/FijiAccounts.Web/FijiAccounts.Web.csproj \
            --configuration Release \
            --runtime linux-musl-x64 \
            --self-contained true \
            --output artifacts/publish \
            /p:UseAppHost=true

      - name: Build production image
        shell: bash
        run: docker build --tag account-island:${GITHUB_SHA} .

      - name: Stage deployment files
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0750 "$DEPLOY_DIR" "$DEPLOY_DIR/stack" \
            "$DEPLOY_DIR/config" "$DEPLOY_DIR/backups" \
            "$DEPLOY_DIR/caddy/data" "$DEPLOY_DIR/caddy/config"
          mkdir -p "$DEPLOY_DIR/data" "$DEPLOY_DIR/keys"
          install -m 0644 deploy/compose.yml "$DEPLOY_DIR/stack/compose.yml"
          install -m 0644 deploy/Caddyfile "$DEPLOY_DIR/stack/Caddyfile"
          touch "$DEPLOY_DIR/config/app.env"
          chmod 0600 "$DEPLOY_DIR/config/app.env"

          docker run --rm \
            --volume "$DEPLOY_DIR/data:/data" \
            --volume "$DEPLOY_DIR/keys:/keys" \
            alpine:3.22 sh -c 'chown -R 1654:1654 /data /keys'

      - name: Provision production email settings
        shell: bash
        env:
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_MICROSOFT_TENANT_ID: ${{ secrets.EMAIL_MICROSOFT_TENANT_ID }}
          EMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.EMAIL_MICROSOFT_CLIENT_ID }}
          EMAIL_MICROSOFT_CLIENT_SECRET: ${{ secrets.EMAIL_MICROSOFT_CLIENT_SECRET }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          env_file="$DEPLOY_DIR/config/app.env"

          # Keep only valid environment assignments. This also repairs files left
          # behind by an accidentally multi-line secret before Docker reads them.
          clean_file="$(mktemp)"
          awk 'NF == 0 || /^[A-Za-z_][A-Za-z0-9_]*=/' "$env_file" > "$clean_file"
          install -m 0600 "$clean_file" "$env_file"
          rm -f "$clean_file"

          update_setting() {
            key="$1"
            value="$2"
            if [[ "$value" == *$'\n'* ]]; then
              echo "::warning::Secret for $key contained extra lines; only the first line was used."
              value="${value%%$'\n'*}"
            fi
            value="${value%$'\r'}"
            temp_file="$(mktemp)"
            awk -F= -v key="$key" '$1 != key' "$env_file" > "$temp_file"
            printf '%s=%s\n' "$key" "$value" >> "$temp_file"
            install -m 0600 "$temp_file" "$env_file"
            rm -f "$temp_file"
          }

          graph_values=(
            "$EMAIL_MICROSOFT_TENANT_ID"
            "$EMAIL_MICROSOFT_CLIENT_ID"
            "$EMAIL_MICROSOFT_CLIENT_SECRET"
          )
          graph_configured=0
          for value in "${graph_values[@]}"; do
            if [ -n "$value" ]; then
              graph_configured=$((graph_configured + 1))
            fi
          done
          if [ "$graph_configured" -gt 0 ]; then
            if [ "$graph_configured" -ne "${#graph_values[@]}" ] || [ -z "$EMAIL_FROM_ADDRESS" ]; then
              echo "Production Microsoft Graph email secrets are incomplete." >&2
              exit 1
            fi

            first_line() {
              local value="$1"
              value="${value%%$'\n'*}"
              printf '%s' "${value%$'\r'}"
            }
            graph_tenant_id="$(first_line "$EMAIL_MICROSOFT_TENANT_ID")"
            graph_client_id="$(first_line "$EMAIL_MICROSOFT_CLIENT_ID")"
            graph_client_secret="$(first_line "$EMAIL_MICROSOFT_CLIENT_SECRET")"

            token_result="$(docker run --rm --network host \
              --env TENANT_ID="$graph_tenant_id" \
              --env CLIENT_ID="$graph_client_id" \
              --env CLIENT_SECRET="$graph_client_secret" \
              --entrypoint sh curlimages/curl:8.12.1 -c '
                curl --silent --show-error \
                  --write-out "\n%{http_code}" \
                  --request POST \
                  --data-urlencode "client_id=$CLIENT_ID" \
                  --data-urlencode "client_secret=$CLIENT_SECRET" \
                  --data-urlencode "scope=https://graph.microsoft.com/.default" \
                  --data-urlencode "grant_type=client_credentials" \
                  "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token"
              ')"
            token_status="${token_result##*$'\n'}"
            if [[ ! "$token_status" =~ ^2[0-9][0-9]$ ]]; then
              token_body="${token_result%$'\n'*}"
              token_error="$(printf '%s' "$token_body" | sed -n 's/.*"error"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
              echo "Microsoft Graph credential validation failed (${token_error:-HTTP $token_status})." >&2
              exit 1
            fi
            unset token_result

            update_setting Email__Provider MicrosoftGraph
            update_setting Email__FromAddress "$EMAIL_FROM_ADDRESS"
            update_setting Email__MicrosoftGraph__TenantId "$graph_tenant_id"
            update_setting Email__MicrosoftGraph__ClientId "$graph_client_id"
            update_setting Email__MicrosoftGraph__ClientSecret "$graph_client_secret"
            echo "Production Microsoft Graph email settings provisioned."
            exit 0
          fi

          values=(
            "$EMAIL_FROM_ADDRESS"
            "$EMAIL_SMTP_HOST"
            "$EMAIL_SMTP_PORT"
            "$EMAIL_SMTP_USERNAME"
            "$EMAIL_SMTP_PASSWORD"
          )
          configured=0
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then
              configured=$((configured + 1))
            fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "Production email secrets are not configured; preserving existing server settings."
            exit 0
          fi
          if [ "$configured" -ne "${#values[@]}" ]; then
            echo "Production email secrets are incomplete." >&2
            exit 1
          fi

          update_setting Email__Provider Smtp
          update_setting Email__FromAddress "$EMAIL_FROM_ADDRESS"
          update_setting Email__Smtp__Host "$EMAIL_SMTP_HOST"
          update_setting Email__Smtp__Port "$EMAIL_SMTP_PORT"
          update_setting Email__Smtp__Username "$EMAIL_SMTP_USERNAME"
          update_setting Email__Smtp__Password "$EMAIL_SMTP_PASSWORD"
          echo "Production email settings provisioned."

      - name: Back up and deploy
        id: deployment
        shell: bash
        env:
          APP_IMAGE: account-island:${{ github.sha }}
        run: |
          set -Eeuo pipefail
          cd "$DEPLOY_DIR/stack"

          previous_image="$(docker inspect --format '{{.Config.Image}}' account-island-app 2>/dev/null || true)"
          app_was_running="$(docker inspect --format '{{.State.Running}}' account-island-app 2>/dev/null || true)"
          restore_dir=""
          cleanup_restore_check() {
            if [ -n "$restore_dir" ] && [[ "$restore_dir" == "$DEPLOY_DIR"/restore-check.* ]]; then
              rm -rf -- "$restore_dir"
              restore_dir=""
            fi
          }
          rollback() {
            cleanup_restore_check
            echo "Deployment failed; restoring the previous application image."
            if [ -n "$previous_image" ]; then
              APP_IMAGE="$previous_image" docker compose up -d app
            fi
          }
          trap rollback ERR

          if [ "$app_was_running" = "true" ]; then
            docker compose stop app
          fi

          backup_name="account-island-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
          docker run --rm \
            --volume "$DEPLOY_DIR/data:/source:ro" \
            --volume "$DEPLOY_DIR/backups:/backup" \
            alpine:3.22 \
            tar -C /source -czf "/backup/$backup_name" .

          backup_path="$DEPLOY_DIR/backups/$backup_name"
          tar -tzf "$backup_path" >/dev/null
          (cd "$DEPLOY_DIR/backups" && sha256sum "$backup_name" > "$backup_name.sha256")

          restore_dir="$(mktemp -d "$DEPLOY_DIR/restore-check.XXXXXX")"
          tar -C "$restore_dir" -xzf "$backup_path"
          docker run --rm \
            --volume "$restore_dir:/restore" \
            alpine:3.22 sh -c 'chown -R 1654:1654 /restore'
          docker run --rm \
            --network none \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env Database__MigrateOnStartup=false \
            --env Maintenance__VerifyDatabase__RequireCurrentMigrations=false \
            --env 'ConnectionStrings__DefaultConnection=Data Source=/app/data/account-island.db;Cache=Shared' \
            --volume "$restore_dir:/app/data" \
            "$APP_IMAGE" verify-database
          cleanup_restore_check

          docker compose up -d --remove-orphans

          docker run --rm --network host curlimages/curl:8.12.1 \
            --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            --header 'Host: app.accountisland.com' \
            --header 'X-Forwarded-Proto: https' \
            http://192.168.1.125:8188/health >/dev/null

          trap - ERR
          echo "backup_name=$backup_name" >> "$GITHUB_OUTPUT"
          find "$DEPLOY_DIR/backups" -type f \
            \( -name 'account-island-*.tar.gz' -o -name 'account-island-*.tar.gz.sha256' \) \
            -mtime +30 -delete
          docker image prune --force --filter "until=168h"

      - name: Replicate verified backup off host
        shell: bash
        env:
          BACKUP_NAME: ${{ steps.deployment.outputs.backup_name }}
          BACKUP_REMOTE_HOST: ${{ secrets.BACKUP_REMOTE_HOST }}
          BACKUP_REMOTE_PORT: ${{ secrets.BACKUP_REMOTE_PORT }}
          BACKUP_REMOTE_USER: ${{ secrets.BACKUP_REMOTE_USER }}
          BACKUP_REMOTE_PATH: ${{ secrets.BACKUP_REMOTE_PATH }}
          BACKUP_REMOTE_SSH_PRIVATE_KEY: ${{ secrets.BACKUP_REMOTE_SSH_PRIVATE_KEY }}
          BACKUP_REMOTE_HOST_KEY: ${{ secrets.BACKUP_REMOTE_HOST_KEY }}
        run: |
          set -Eeuo pipefail
          required=(
            "$BACKUP_REMOTE_HOST"
            "$BACKUP_REMOTE_USER"
            "$BACKUP_REMOTE_PATH"
            "$BACKUP_REMOTE_SSH_PRIVATE_KEY"
            "$BACKUP_REMOTE_HOST_KEY"
          )
          configured=0
          for value in "${required[@]}"; do
            if [ -n "$value" ]; then
              configured=$((configured + 1))
            fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "Off-host backup replication is not configured; the verified local backup was retained."
            exit 0
          fi
          if [ "$configured" -ne "${#required[@]}" ]; then
            echo "Off-host backup replication secrets are incomplete." >&2
            exit 1
          fi

          port="${BACKUP_REMOTE_PORT:-22}"
          [[ "$BACKUP_REMOTE_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid backup host." >&2; exit 1; }
          [[ "$BACKUP_REMOTE_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid backup user." >&2; exit 1; }
          [[ "$BACKUP_REMOTE_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid backup path." >&2; exit 1; }
          [[ "$port" =~ ^[0-9]+$ ]] && [ "$port" -ge 1 ] && [ "$port" -le 65535 ] || { echo "Invalid backup SSH port." >&2; exit 1; }
          [[ "$BACKUP_NAME" =~ ^account-island-[0-9]{8}T[0-9]{6}Z.tar.gz$ ]] || { echo "Invalid backup filename." >&2; exit 1; }

          ssh_dir="$(mktemp -d)"
          cleanup() {
            rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
            rmdir -- "$ssh_dir"
          }
          trap cleanup EXIT
          printf '%s\n' "$BACKUP_REMOTE_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$BACKUP_REMOTE_HOST_KEY" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"

          ssh_common=(
            -i "$ssh_dir/id_ed25519"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_dir/known_hosts"
          )
          ssh -p "$port" "${ssh_common[@]}" \
            "$BACKUP_REMOTE_USER@$BACKUP_REMOTE_HOST" \
            "install -d -m 0700 '$BACKUP_REMOTE_PATH'"
          scp -P "$port" "${ssh_common[@]}" \
            "$DEPLOY_DIR/backups/$BACKUP_NAME" \
            "$DEPLOY_DIR/backups/$BACKUP_NAME.sha256" \
            "$BACKUP_REMOTE_USER@$BACKUP_REMOTE_HOST:$BACKUP_REMOTE_PATH/"
          ssh -p "$port" "${ssh_common[@]}" \
            "$BACKUP_REMOTE_USER@$BACKUP_REMOTE_HOST" \
            "cd '$BACKUP_REMOTE_PATH' && sha256sum --check '$BACKUP_NAME.sha256'"

      - name: Send deployment failure alert
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        env:
          OPERATIONS_ALERT_EMAIL: ${{ secrets.OPERATIONS_ALERT_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "$OPERATIONS_ALERT_EMAIL" ]; then
            echo "Operations alert email is not configured."
            exit 0
          fi

          image="account-island:${GITHUB_SHA}"
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            image="$(docker inspect --format '{{.Config.Image}}' account-island-app 2>/dev/null || true)"
          fi
          if [ -z "$image" ]; then
            echo "No Account Island image is available to send the operations alert." >&2
            exit 1
          fi

          docker run --rm --network host \
            --env-file "$DEPLOY_DIR/config/app.env" \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env Maintenance__OperationsAlert__Recipient="$OPERATIONS_ALERT_EMAIL" \
            --env Maintenance__OperationsAlert__Subject="Account Island production deployment failed" \
            --env Maintenance__OperationsAlert__Body="Deployment ${GITHUB_SHA} failed. Review the protected workflow logs at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
            "$image" send-operations-alert

  verify-public:
    name: Verify public HTTPS
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            --output "$response_file" \
            https://app.accountisland.com/health

          if ! grep --extended-regexp --quiet \
            '"status"[[:space:]]*:[[:space:]]*"healthy"' \
            "$response_file"; then
            echo "Public health endpoint did not report healthy." >&2
            exit 1
          fi

  notify-public-failure:
    name: Alert on public health failure
    needs: [deploy, verify-public]
    if: ${{ always() && needs.deploy.result == 'success' && needs.verify-public.result == 'failure' }}
    runs-on: [self-hosted, Linux, X64, account-island]
    timeout-minutes: 5
    environment:
      name: production
    env:
      DEPLOY_DIR: /mnt/data/account-island
      OPERATIONS_ALERT_EMAIL: ${{ secrets.OPERATIONS_ALERT_EMAIL }}
    steps:
      - name: Send public health failure alert
        if: ${{ env.OPERATIONS_ALERT_EMAIL != '' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          image="$(docker inspect --format '{{.Config.Image}}' account-island-app)"
          docker run --rm --network host \
            --env-file "$DEPLOY_DIR/config/app.env" \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env Maintenance__OperationsAlert__Recipient="$OPERATIONS_ALERT_EMAIL" \
            --env Maintenance__OperationsAlert__Subject="Account Island public health check failed" \
            --env Maintenance__OperationsAlert__Body="The deployed application passed its internal readiness check, but the public HTTPS check failed. Review DNS, router forwarding, Caddy and TLS, then inspect ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
            "$image" send-operations-alert
