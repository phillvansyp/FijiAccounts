name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-island-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: [self-hosted, Linux, X64, account-island]
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.accountisland.com
    env:
      DEPLOY_DIR: /mnt/data/account-island
      DOTNET_ROOT: /mnt/data/account-island/dotnet
      DOTNET_CLI_HOME: /mnt/data/account-island/dotnet-cli
      NUGET_PACKAGES: /mnt/data/account-island/nuget/packages

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run test suite
        shell: bash
        run: /mnt/data/account-island/dotnet/dotnet test FijiAccounts.slnx --configuration Release

      - name: Publish production application
        shell: bash
        run: |
          /mnt/data/account-island/dotnet/dotnet publish src/FijiAccounts.Web/FijiAccounts.Web.csproj \
            --configuration Release \
            --runtime linux-musl-x64 \
            --self-contained true \
            --output artifacts/publish \
            /p:UseAppHost=true

      - name: Build production image
        shell: bash
        run: docker build --tag account-island:${GITHUB_SHA} .

      - name: Stage deployment files
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0750 "$DEPLOY_DIR" "$DEPLOY_DIR/stack" \
            "$DEPLOY_DIR/config" "$DEPLOY_DIR/backups" \
            "$DEPLOY_DIR/caddy/data" "$DEPLOY_DIR/caddy/config"
          mkdir -p "$DEPLOY_DIR/data" "$DEPLOY_DIR/keys"
          install -m 0644 deploy/compose.yml "$DEPLOY_DIR/stack/compose.yml"
          install -m 0644 deploy/Caddyfile "$DEPLOY_DIR/stack/Caddyfile"
          touch "$DEPLOY_DIR/config/app.env"
          chmod 0600 "$DEPLOY_DIR/config/app.env"

          docker run --rm \
            --volume "$DEPLOY_DIR/data:/data" \
            --volume "$DEPLOY_DIR/keys:/keys" \
            alpine:3.22 sh -c 'chown -R 1654:1654 /data /keys'

      - name: Provision production email settings
        shell: bash
        env:
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_MICROSOFT_TENANT_ID: ${{ secrets.EMAIL_MICROSOFT_TENANT_ID }}
          EMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.EMAIL_MICROSOFT_CLIENT_ID }}
          EMAIL_MICROSOFT_CLIENT_SECRET: ${{ secrets.EMAIL_MICROSOFT_CLIENT_SECRET }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          env_file="$DEPLOY_DIR/config/app.env"
          update_setting() {
            key="$1"
            value="$2"
            temp_file="$(mktemp)"
            awk -F= -v key="$key" '$1 != key' "$env_file" > "$temp_file"
            printf '%s=%s\n' "$key" "$value" >> "$temp_file"
            install -m 0600 "$temp_file" "$env_file"
            rm -f "$temp_file"
          }

          graph_values=(
            "$EMAIL_MICROSOFT_TENANT_ID"
            "$EMAIL_MICROSOFT_CLIENT_ID"
            "$EMAIL_MICROSOFT_CLIENT_SECRET"
          )
          graph_configured=0
          for value in "${graph_values[@]}"; do
            if [ -n "$value" ]; then
              graph_configured=$((graph_configured + 1))
            fi
          done
          if [ "$graph_configured" -gt 0 ]; then
            if [ "$graph_configured" -ne "${#graph_values[@]}" ] || [ -z "$EMAIL_FROM_ADDRESS" ]; then
              echo "Production Microsoft Graph email secrets are incomplete." >&2
              exit 1
            fi

            update_setting Email__Provider MicrosoftGraph
            update_setting Email__FromAddress "$EMAIL_FROM_ADDRESS"
            update_setting Email__MicrosoftGraph__TenantId "$EMAIL_MICROSOFT_TENANT_ID"
            update_setting Email__MicrosoftGraph__ClientId "$EMAIL_MICROSOFT_CLIENT_ID"
            update_setting Email__MicrosoftGraph__ClientSecret "$EMAIL_MICROSOFT_CLIENT_SECRET"
            echo "Production Microsoft Graph email settings provisioned."
            exit 0
          fi

          values=(
            "$EMAIL_FROM_ADDRESS"
            "$EMAIL_SMTP_HOST"
            "$EMAIL_SMTP_PORT"
            "$EMAIL_SMTP_USERNAME"
            "$EMAIL_SMTP_PASSWORD"
          )
          configured=0
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then
              configured=$((configured + 1))
            fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "Production email secrets are not configured; preserving existing server settings."
            exit 0
          fi
          if [ "$configured" -ne "${#values[@]}" ]; then
            echo "Production email secrets are incomplete." >&2
            exit 1
          fi

          update_setting Email__Provider Smtp
          update_setting Email__FromAddress "$EMAIL_FROM_ADDRESS"
          update_setting Email__Smtp__Host "$EMAIL_SMTP_HOST"
          update_setting Email__Smtp__Port "$EMAIL_SMTP_PORT"
          update_setting Email__Smtp__Username "$EMAIL_SMTP_USERNAME"
          update_setting Email__Smtp__Password "$EMAIL_SMTP_PASSWORD"
          echo "Production email settings provisioned."

      - name: Back up and deploy
        shell: bash
        env:
          APP_IMAGE: account-island:${{ github.sha }}
        run: |
          set -Eeuo pipefail
          cd "$DEPLOY_DIR/stack"

          previous_image="$(docker inspect --format '{{.Config.Image}}' account-island-app 2>/dev/null || true)"
          app_was_running="$(docker inspect --format '{{.State.Running}}' account-island-app 2>/dev/null || true)"
          rollback() {
            echo "Deployment failed; restoring the previous application image."
            if [ -n "$previous_image" ]; then
              APP_IMAGE="$previous_image" docker compose up -d app
            fi
          }
          trap rollback ERR

          if [ "$app_was_running" = "true" ]; then
            docker compose stop app
          fi

          backup_name="account-island-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
          docker run --rm \
            --volume "$DEPLOY_DIR/data:/source:ro" \
            --volume "$DEPLOY_DIR/backups:/backup" \
            alpine:3.22 \
            tar -C /source -czf "/backup/$backup_name" .

          docker compose up -d --remove-orphans

          docker run --rm --network host curlimages/curl:8.12.1 \
            --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            --header 'Host: app.accountisland.com' \
            --header 'X-Forwarded-Proto: https' \
            http://192.168.1.125:8188/health >/dev/null

          trap - ERR
          find "$DEPLOY_DIR/backups" -type f -name 'account-island-*.tar.gz' \
            -mtime +30 -delete
          docker image prune --force --filter "until=168h"
