<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#073b4c">
    <title>Account Island is offline</title>
    <style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:#f3f7f8;color:#073b4c;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
        main{width:min(440px,100%);padding:2rem;text-align:center;border:1px solid #d8e7e4;border-radius:1.2rem;background:#fff;box-shadow:0 18px 45px rgba(7,59,76,.12)}
        img{width:92px;height:92px;border-radius:1rem}h1{margin:.9rem 0 .45rem;font-size:1.6rem}p{margin:0 0 1.25rem;color:#607681;line-height:1.55}
        button{padding:.7rem 1rem;border:0;border-radius:.65rem;background:#087f5b;color:#fff;font:inherit;font-weight:750;cursor:pointer}
    </style>
</head>
<body>
<main>
    <img src="/account-island-icon-192.png?v=3" alt="Account Island">
    <h1>You are offline</h1>
    <p>Reconnect to the internet, then try Account Island again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
