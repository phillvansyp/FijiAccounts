name: account-island

services:
  app:
    image: ${APP_IMAGE:-account-island:latest}
    container_name: account-island-app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      AllowedHosts: app.accountisland.com;localhost;127.0.0.1
      ConnectionStrings__DefaultConnection: Data Source=/app/data/account-island.db;Cache=Shared
      Database__MigrateOnStartup: "true"
      DataProtection__KeysPath: /app/keys
      TZ: Pacific/Fiji
    env_file:
      - /mnt/data/account-island/config/app.env
    volumes:
      - /mnt/data/account-island/data:/app/data
      - /mnt/data/account-island/keys:/app/keys
    ports:
      - "192.168.1.125:8188:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--header=Host: app.accountisland.com", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: account-island-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - /mnt/data/account-island/stack/Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/data/account-island/caddy/data:/data
      - /mnt/data/account-island/caddy/config:/config
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "192.168.1.125:8280:80"
      - "192.168.1.125:8443:443"
    security_opt:
      - no-new-privileges:true
